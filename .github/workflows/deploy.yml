name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Rebuild daily so the Google rating and review count stay current
    - cron: '0 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Preview mode (no CUSTOM_DOMAIN variable): served from https://<owner>.github.io/<repo>/
          # and hidden from Google. Once the repo variable CUSTOM_DOMAIN is set
          # (Settings > Secrets and variables > Actions > Variables), the site builds for the real domain.
          BASE_PATH: ${{ !vars.CUSTOM_DOMAIN && format('/{0}', github.event.repository.name) || '' }}
          NOINDEX: ${{ !vars.CUSTOM_DOMAIN && 'true' || 'false' }}
          # Optional: Google Places API key for the live rating (Settings > Secrets > Actions)
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
