# Pages CMS configuration: https://pagescms.org
# Chris signs in at https://app.pagescms.org with GitHub and edits everything below
# through a simple form. Saving commits to the repo and the host rebuilds the site.

media:
  input: public/images
  output: /images

content:
  - name: courses
    label: Courses
    type: collection
    path: src/content/courses
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, price, dates, status]
      primary: title
      sort: [order, title]
    fields:
      - name: title
        label: Course name
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [scent, training, workshop]
      - name: price
        label: Price (e.g. £130, or "Enquire")
        type: string
        required: true
      - name: duration
        label: Duration (e.g. 6 weeks)
        type: string
      - name: dates
        label: Dates / times (e.g. Starts Sun 18 Oct, 9am)
        type: string
      - name: status
        label: Booking status
        type: select
        options:
          values: [open, coming-soon, enquire, one-to-one]
      - name: level
        label: Who it's for
        type: string
      - name: venue
        label: Where (e.g. Wednesbury, outdoors)
        type: string
      - name: bookingUrl
        label: Booking link (open the course on Bookwhen and copy the address from the top of the page). Leave empty to use the website enquiry form
        type: string
      - name: image
        label: Image
        type: image
      - name: imageAlt
        label: Image description (for screen readers & Google)
        type: string
      - name: logo
        label: Small logo in the corner of the image (optional, e.g. BetterDog)
        type: image
      - name: logoAlt
        label: Corner logo description
        type: string
      - name: badge
        label: Image is a round badge/logo
        type: boolean
      - name: featured
        label: Show on the home page
        type: boolean
      - name: hidden
        label: Hide this course from the site
        type: boolean
      - name: order
        label: Sort order (1 = first)
        type: number
      - name: body
        label: Short description
        type: text

  - name: reviews
    label: Reviews (copy and paste from Google)
    type: collection
    path: src/content/reviews
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [name, date]
      primary: name
    fields:
      - name: name
        label: Reviewer name
        type: string
        required: true
      - name: date
        label: Review date
        type: date
        required: true
      - name: rating
        label: Stars (1-5)
        type: number
      - name: topic
        label: Course / service reviewed
        type: string
      - name: excerpt
        label: Shortened quote (shows a link to the full review on Google)
        type: boolean
      - name: body
        label: Review text
        type: text

  - name: settings
    label: Contact details & settings
    type: file
    path: src/data/settings.json
    format: json
    fields:
      - { name: businessName, label: Business name, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: trainerName, label: Trainer first name, type: string }
      - { name: phone, label: Phone number, type: string }
      - { name: whatsapp, label: WhatsApp number (international format, no + or spaces e.g. 447804251993), type: string }
      - { name: email, label: Email, type: string }
      - { name: location, label: Location, type: string }
      - { name: region, label: Region, type: string }
      - { name: hours, label: Opening hours, type: string }
      - { name: facebook, label: Facebook URL, type: string }
      - { name: instagram, label: Instagram URL, type: string }
      - { name: tiktok, label: TikTok URL, type: string }
      - { name: bookwhenUrl, label: Bookwhen booking page URL, type: string }
      - { name: googleReviewsUrl, label: Google reviews URL, type: string }
      - { name: rating, label: "Google star rating (e.g. 5.0). Update when it changes on Google", type: string }
      - { name: reviewCount, label: Number of Google reviews, type: number }
      - { name: reviewsWidgetProvider, label: "Live Google reviews: provider name (e.g. JustReview)", type: string }
      - { name: reviewsWidgetCode, label: "Live Google reviews: paste the widget embed code here. Leave empty to show only the reviews added above", type: text }
      - { name: mapQuery, label: "Google Map location on the Contact page (e.g. Wall Heath, Kingswinford). Leave empty to hide the map", type: string }
      - { name: legalNotice, label: "Business details for the footer, if required (e.g. registered company name and number, VAT number)", type: string }
      - { name: web3formsKey, label: Web3Forms access key (contact form), type: string }

  - name: packages
    label: 1-1 packages
    type: file
    path: src/data/packages.json
    format: json
    fields:
      - name: packages
        label: Packages
        type: object
        list: true
        fields:
          - { name: name, label: Package name, type: string }
          - { name: price, label: Price, type: string }
          - { name: hours, label: Training hours (e.g. 3 hrs training), type: string }
          - { name: summary, label: What's included, type: string }

  - name: gallery
    label: Gallery
    type: file
    path: src/data/gallery.json
    format: json
    fields:
      - name: photos
        label: Photos
        type: object
        list: true
        fields:
          - { name: image, label: Photo, type: image }
          - { name: alt, label: Description, type: string }

  - name: faq
    label: FAQs
    type: file
    path: src/data/faq.json
    format: json
    fields:
      - { name: title, label: Section heading, type: string }
      - name: questions
        label: Questions (drag to reorder, add as many as you like)
        type: object
        list: true
        fields:
          - { name: section, label: "Section heading (e.g. Training, Scentwork)", type: string }
          - { name: question, label: Question, type: string, required: true }
          - { name: answer, label: Answer (leave a blank line between paragraphs), type: text, required: true }

  - name: blog
    label: Blog posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, draft]
      primary: title
      sort: [date]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: summary
        label: Short summary (shown on the blog list and home page)
        type: text
      - name: image
        label: Cover photo
        type: image
      - name: imageAlt
        label: Cover photo description
        type: string
      - name: draft
        label: Hide this post (draft)
        type: boolean
      - name: body
        label: Post
        type: rich-text

  - name: timeline
    label: About page timeline
    type: file
    path: src/data/timeline.json
    format: json
    fields:
      - name: entries
        label: Timeline (drag to reorder)
        type: object
        list: true
        fields:
          - { name: when, label: "When (e.g. 1980s)", type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Story, type: text }
          - { name: image, label: Photo (optional), type: image }
          - { name: imageAlt, label: Photo description, type: string }
          - { name: image2, label: Second small photo (optional), type: image }
          - { name: image2Alt, label: Second photo description, type: string }

  - name: partners
    label: Partners
    type: file
    path: src/data/partners.json
    format: json
    fields:
      - name: partners
        label: Partners (drag to reorder)
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: logo, label: Logo, type: image }
          - { name: description, label: Description, type: text }
          - { name: perk, label: "Client offer (e.g. Client discount code available)", type: string }
          - { name: link, label: Website link (optional), type: string }

